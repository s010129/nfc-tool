name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::沒有設定 KEYSTORE_BASE64，這次用臨時金鑰簽章，新版無法直接覆蓋安裝舊版"
          fi
      - name: Build APK and run tests
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease testDebugUnitTest --console=plain
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk nfc-tool.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: NFC 讀寫工具 Android v1.0.${{ github.run_number }}
          make_latest: true
          files: android/nfc-tool.apk
          body: |
            Android 版 NFC 讀寫工具。下載 `nfc-tool.apk`，在手機上打開安裝（需允許「安裝不明來源的應用程式」）。
            新版可以直接覆蓋安裝，紀錄和常用內容會保留。
